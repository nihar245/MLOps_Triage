name: triageiq

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  gateway:
    <<: *hardening
    build: {context: ., dockerfile: services/gateway/Dockerfile}
    image: ${REGISTRY:-}triageiq-gateway:${IMAGE_TAG:-dev}
    environment:
      GATEWAY_HTPASSWD: ${GATEWAY_HTPASSWD}
    ports: ["127.0.0.1:${GATEWAY_PORT:-8080}:8080"]
    tmpfs: [/tmp, "/etc/nginx/conf.d:uid=101,gid=101"]   # template is rendered into conf.d at start by UID 101
    depends_on:
      backend-api: {condition: service_healthy}
      feedback-service: {condition: service_healthy}
    deploy: {resources: {limits: {memory: 64M, cpus: "0.50"}}}   # A8: 2 x measured peak

  backend-api:
    <<: *hardening
    build: {context: ., dockerfile: services/backend-api/Dockerfile}
    image: ${REGISTRY:-}triageiq-backend-api:${IMAGE_TAG:-dev}
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql://triageiq:${POSTGRES_PASSWORD}@postgres:5432/triageiq
      MODEL_SERVICE_URL: ${MODEL_SERVICE_URL:-http://model-service:8000}
      MODEL_CALL_TIMEOUT_SECONDS: ${MODEL_CALL_TIMEOUT_SECONDS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres: {condition: service_healthy}
    deploy: {resources: {limits: {memory: 128M, cpus: "0.50"}}}

  feedback-service:
    <<: *hardening
    build: {context: ., dockerfile: services/feedback-service/Dockerfile}
    image: ${REGISTRY:-}triageiq-feedback-service:${IMAGE_TAG:-dev}
    ports: ["127.0.0.1:8001:8000"]
    environment:
      DATABASE_URL: postgresql://triageiq:${POSTGRES_PASSWORD}@postgres:5432/triageiq
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres: {condition: service_healthy}
    deploy: {resources: {limits: {memory: 192M, cpus: "0.50"}}}

  ticket-generator:
    <<: *hardening
    build: {context: ., dockerfile: services/ticket-generator/Dockerfile}
    image: ${REGISTRY:-}triageiq-ticket-generator:${IMAGE_TAG:-dev}
    environment:
      BACKEND_URL: http://backend-api:8000
      TICKET_INTERVAL_SECONDS: ${TICKET_INTERVAL_SECONDS:-15}
      DRIFT_ENABLED: ${DRIFT_ENABLED:-false}
      DRIFT_START_AFTER: ${DRIFT_START_AFTER:-100}
      DRIFT_RATIO: ${DRIFT_RATIO:-0.4}
      DRIFT_SEED: ${DRIFT_SEED:-42}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes: [generator_state:/state]
    depends_on:
      backend-api: {condition: service_healthy}
    deploy: {resources: {limits: {memory: 320M, cpus: "0.50"}}}   # A8: 2 x measured peak

  postgres:
    build: {context: ., dockerfile: services/postgres/Dockerfile}
    image: ${REGISTRY:-}triageiq-postgres:${IMAGE_TAG:-dev}
    environment:
      POSTGRES_USER: triageiq
      POSTGRES_DB: triageiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U triageiq"], interval: 5s, retries: 10}
    security_opt: ["no-new-privileges:true"]
    deploy: {resources: {limits: {memory: 256M, cpus: "1.0"}}}
    restart: unless-stopped

  model-service:
    <<: *hardening
    build: {context: ., dockerfile: services/model-service/Dockerfile}
    image: ${REGISTRY:-}triageiq-model-service:${IMAGE_TAG:-dev}
    environment:
      LOCAL_ARTIFACTS_DIR: /app/artifacts
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./artifacts:/app/artifacts:ro
    ports: ["127.0.0.1:8002:8000"]
    deploy: {resources: {limits: {memory: 960M, cpus: "1.0"}}}

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["127.0.0.1:3005:3000"]
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  generator_state:
  prometheus_data:
  grafana_data:
